<style>
:root{--acc:#7c3aed;--acc-dark:#5b21b6;--acc-soft:#f4f0fe;--acc-line:#ddd1fb;--acc-ink:#3b1d8f;}
::selection{background:var(--acc);color:#fff}
.acc-text{color:var(--acc)}.acc-bg{background:var(--acc)}.acc-soft{background:var(--acc-soft)}
.acc-border{border-color:var(--acc)}.acc-line{border-color:var(--acc-line)}
.btn-acc{background:var(--acc);color:#fff}.btn-acc:hover{background:var(--acc-dark)}
.ring-acc:focus{outline:none;box-shadow:0 0 0 3px rgba(124,58,237,.28);border-color:var(--acc)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc.open>.acc-body{grid-template-rows:1fr}
.acc.open .chev{transform:rotate(90deg)}
.chev{transition:transform .25s}
s.err{color:#b91c1c;text-decoration:line-through;text-decoration-color:#f87171;text-decoration-thickness:2px}
mark.fix{background:#d9f5e6;color:#14532d;border-radius:4px;padding:0 .3em;font-weight:600}
mark.key{background:var(--acc-soft);color:var(--acc-ink);border-radius:4px;padding:0 .3em;font-weight:600}
.practice td.mask{filter:blur(6px);user-select:none;cursor:pointer}
.practice tr.revealed td.mask{filter:none;user-select:auto}
.leaf.on{background:var(--acc-soft);color:var(--acc-ink);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
aside::-webkit-scrollbar{width:5px}aside::-webkit-scrollbar-thumb{background:#d6d3cd;border-radius:99px}
.opt.ok{background:#ecfdf5;border-color:#34d399}.opt.ok .let{background:#059669;color:#fff;border-color:#059669}
.opt.bad{background:#fef2f2;border-color:#f87171}.opt.bad .let{background:#dc2626;color:#fff;border-color:#dc2626}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
.paper-num{font-family:Fraunces,serif;font-weight:900}
table.vocab td,table.vocab th{padding:.65rem .8rem;border-bottom:1px solid #ece9e2;vertical-align:top}
html.dark{--acc-soft:rgba(124,58,237,.16);--acc-line:rgba(124,58,237,.45);--acc-ink:#c4b5fd}
.dark body{background-color:#0e1116!important}

.dark .bg-white\/95{background-color:rgba(22,26,34,.92)!important}
.dark .bg-white\/80{background-color:rgba(22,26,34,.8)!important}

.dark .bg-slate-100{background-color:#242a37!important}
.dark .text-slate-900,.dark .text-slate-800,.dark .text-slate-700{color:#e7eaf2!important}
.dark .text-slate-600,.dark .text-slate-500{color:#98a1b3!important}
.dark .text-slate-400{color:#6b7488!important}
.dark .text-slate-300{color:#4d5568!important}
.dark .border-slate-100,.dark .border-slate-200{border-color:#2a3040!important}
.dark .border-slate-300{border-color:#39415a!important}
.dark .divide-slate-100>*{border-color:#2a3040!important}
.dark .placeholder\:text-slate-400::placeholder{color:#6b7488!important}
.dark .hover\:bg-slate-50:hover,.dark .hover\:bg-slate-50\/60:hover{background-color:#1d222d!important}
.dark .hover\:text-slate-800:hover,.dark .hover\:text-slate-700:hover{color:#e7eaf2!important}
.dark .hover\:border-slate-300:hover,.dark .hover\:border-slate-400:hover{border-color:#39415a!important}
.dark .bg-emerald-50{background-color:rgba(16,185,129,.14)!important}
.dark .bg-rose-50{background-color:rgba(244,63,94,.14)!important}
.dark .bg-amber-50{background-color:rgba(245,158,11,.14)!important}
.dark .text-emerald-900{color:#b9f0d6!important}.dark .text-emerald-800{color:#6ee7b7!important}
.dark .text-emerald-700,.dark .text-emerald-600,.dark .text-emerald-500{color:#34d399!important}
.dark .text-rose-900{color:#fecdd3!important}.dark .text-rose-600,.dark .text-rose-500{color:#fb7185!important}
.dark .text-amber-900{color:#fde68a!important}.dark .text-amber-600{color:#fbbf24!important}

<script src="content.js"></script>
<script>
"use strict";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/'/g,"&#39;").replace(/"/g,"&quot;");}
function norm(s){return s.toLowerCase().replace(/[\u2019\u02BC']/g,"'").replace(/\s+/g," ").replace(/[.!。]/g,"").trim();}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function crumbs(p){return "<p class='text-[11px] font-bold uppercase tracking-[.18em] text-slate-400 mb-3'>"+p.join(" <span class='text-slate-300'>▸</span> ")+"</p>";}
function pageHead(t,tag,blurb){return "<div class='mb-7'><div class='flex flex-wrap items-center gap-3 mb-2'><h1 class='font-display font-black text-3xl md:text-4xl tracking-tight text-slate-900'>"+t+"</h1>"+(tag?"<span class='acc-soft acc-text text-[11px] font-bold px-2.5 py-1 rounded-full border acc-line'>"+tag+"</span>":"")+"</div>"+(blurb?"<p class='text-slate-500 max-w-3xl leading-relaxed'>"+blurb+"</p>":"")+"</div>";}
function taskCard(head,items){return "<div class='rounded-2xl border-2 acc-line acc-soft p-6 mb-6'><p class='font-bold text-slate-900 mb-3 flex items-center gap-2'><svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='var(--acc)' stroke-width='2.4'><path d='M20 6L9 17l-5-5'/></svg>"+head+"</p><ul class='space-y-1.5'>"+items.map(function(x){return "<li class='flex gap-2.5 text-[15px] text-slate-700'><span class='acc-text font-bold'>•</span>"+x+"</li>";}).join("")+"</ul></div>";}
function modelAnswer(title,html){return "<details class='bg-white rounded-2xl border-2 border-emerald-200 mb-6'><summary class='p-5 font-bold text-emerald-800 flex justify-between items-center'>"+title+" — toggle to reveal <span class='text-emerald-500 font-normal text-sm'>click</span></summary><div class='px-5 pb-6 border-t border-emerald-100 pt-4 text-[15px] leading-[1.85] text-slate-700'>"+html+"</div></details>";}
function tipBox(t){return "<div class='acc-soft border acc-line rounded-xl p-4 text-sm text-slate-600'><span class='font-bold acc-text'>Examiner's lens:</span> "+t+"</div>";}
function mcFill(n,prompt,accepts,exp){return "<div class='qitem bg-white rounded-xl border border-slate-200 p-5'><p class='text-[15px] text-slate-800'><span class='paper-num acc-text mr-2'>"+n+"</span>"+prompt+"</p><div class='mt-3 flex flex-wrap gap-2'><input data-input type='text' class='ring-acc text-sm px-3 py-2 rounded-lg border border-slate-300 w-full sm:w-64' placeholder='Type your answer…' autocomplete='off'><button data-check data-accepts='"+esc(JSON.stringify(accepts))+"' class='btn-acc text-sm font-bold px-4 py-2 rounded-lg'>Check</button><button data-reveal='r"+n+"' data-show='Reveal' data-hide='Hide' class='btn-rev text-sm font-semibold text-slate-500 border border-slate-200 hover:bg-slate-50 px-3 py-2 rounded-lg'>Reveal</button></div><p data-fb class='hidden mt-2 text-sm font-semibold'></p><div id='rv-r"+n+"' class='hidden mt-3 text-sm animate-fadein'><span class='font-bold text-emerald-700'>Answer:</span> <b>"+accepts[0]+"</b> — "+exp+"</div></div>";}
function mcRadio(n,prompt,opts,correct,exp,letters){letters=letters||"ABCD";return "<div class='qitem bg-white rounded-xl border border-slate-200 p-5' data-mcwrap data-correct='"+correct+"'><p class='text-[15px] text-slate-800 mb-3'><span class='paper-num acc-text mr-2'>"+n+"</span>"+prompt+"</p><div class='space-y-2'>"+opts.map(function(o,j){return "<label class='opt flex items-center gap-3 border border-slate-200 rounded-lg px-3 py-2 cursor-pointer hover:border-slate-300 transition text-sm'><input type='radio' name='rq"+n+"' value='"+j+"' class='accent-[#7c3aed]'><span class='let w-6 h-6 shrink-0 grid place-items-center text-xs font-bold border border-slate-300 rounded-md text-slate-500'>"+letters[j]+"</span><span>"+o+"</span></label>";}).join("")+"</div><div class='mt-3'><button data-mccheck class='btn-acc text-sm font-bold px-4 py-2 rounded-lg'>Check answer</button></div><div data-mcexp class='hidden mt-3 text-sm rounded-lg px-4 py-3 animate-fadein'>"+(letters?"<b>"+letters[correct]+".</b> ":"")+exp+"</div></div>";}
function renderReading(d){
  var paras=d.paras.map(function(p,i){return "<div class='flex gap-4 "+(i>0?"mt-5":"")+"'><span class='paper-num text-slate-300 text-2xl shrink-0 w-7 text-right leading-none pt-0.5'>"+(i+1)+"</span><p class='text-[15.5px] leading-[1.85] text-slate-700'>"+p+"</p></div>";}).join("");
  var qs=d.qs.map(function(q,idx){var n=idx+1;
    if(q.t==="mc")return mcRadio(n,q.q,q.opts,q.correct,q.exp);
    if(q.t==="tfng")return mcRadio(n,q.q,["True","False","Not Given"],q.correct,q.exp,"");
    return mcFill(n,q.q,q.accepts,q.exp);}).join("");
  return crumbs(d.cr)+pageHead(d.title,d.tag,d.blurb)+
  "<article class='bg-white rounded-2xl border border-slate-200 p-6 md:p-9 mb-8 shadow-sm'><h2 class='font-display font-bold text-xl text-slate-900 mb-5'>"+d.passTitle+"</h2>"+paras+"</article>"+
  "<h3 class='font-display font-bold text-2xl text-slate-900 mb-5'>Questions</h3><div class='space-y-5'>"+qs+"</div>"+
  "<details class='mt-8 bg-white rounded-2xl border border-slate-200'><summary class='p-5 font-bold text-slate-800 flex justify-between items-center'>Scoring guide — toggle to reveal <span class='text-slate-400 font-normal text-sm'>click</span></summary><div class='px-5 pb-5 text-sm text-slate-600 space-y-2 border-t border-slate-100 pt-4'>"+d.guide+"</div></details>";
}
function renderWriting(d){return crumbs(d.cr)+pageHead(d.title,d.tag,d.blurb)+(d.source||"")+taskCard(d.reqHead||"Task",d.bullets||[])+(d.scaffold||"")+modelAnswer(d.modelTitle,d.model)+(d.tip?tipBox(d.tip):"");}
function renderSpeaking(d){return crumbs(d.cr)+pageHead(d.title,d.tag,d.blurb)+
 "<div class='bg-white rounded-2xl border border-slate-200 p-5 mb-6'><p class='font-bold text-slate-800 mb-3'>Source text</p><dl class='divide-y divide-slate-100'>"+d.source.map(function(r){return "<div class='py-2.5 grid sm:grid-cols-[140px_1fr] gap-1 sm:gap-4 text-sm'><dt class='font-semibold text-slate-400'>"+r[0]+"</dt><dd class='text-slate-700'>"+r[1]+"</dd></div>";}).join("")+"</dl></div>"+
 taskCard("Discussion task",d.task)+
 "<div class='bg-white rounded-2xl border border-slate-200 p-5 mb-6'><p class='font-bold text-slate-800 mb-3'>Level 5 strategy pointers</p><ul class='space-y-2'>"+d.pointers.map(function(p){return "<li class='text-sm text-slate-700 leading-relaxed'><span class='acc-text font-bold'>•</span> "+p+"</li>";}).join("")+"</ul></div>"+
 modelAnswer(d.modelQ,d.modelA);}
function renderListening(d){
  var tasks=d.tasks.map(function(q,idx){var n=idx+1;
    if(q.t==="mc")return mcRadio(n,q.q,q.opts,q.correct,q.exp);
    return mcFill(n,q.q,q.accepts,q.exp);}).join("");
  return crumbs(d.cr)+pageHead(d.title,d.tag,d.blurb)+taskCard(d.reqHead,d.bullets)+"<div class='space-y-4 mb-6'>"+tasks+"</div>"+modelAnswer(d.modelTitle,d.model);
}
function renderWs(d){
  var items=d.items.map(function(it,i){var id=d.key+"-"+i;
    if(d.mode==="reveal"){return "<div class='qitem bg-white rounded-xl border border-slate-200 p-5'><div class='flex gap-4'><span class='paper-num acc-text text-lg leading-none pt-0.5 w-7 shrink-0 text-right'>"+(i+1)+"</span><div class='flex-1 min-w-0'><p class='text-[15px] leading-relaxed text-slate-800'>"+it.q+"</p><button data-reveal='"+id+"' data-show='Show correction' data-hide='Hide correction' class='btn-rev mt-3 text-xs font-bold acc-text border acc-line acc-soft hover:opacity-80 px-3 py-1.5 rounded-lg transition'>Show correction</button><div id='rv-"+id+"' class='hidden mt-4 space-y-2 animate-fadein'><p class='text-[15px] leading-relaxed bg-slate-50 border border-slate-200 rounded-lg px-4 py-3'>"+it.marked+"</p><p class='text-sm'><span class='font-bold text-emerald-700'>"+it.a+"</span></p><p class='text-sm text-slate-500 leading-relaxed'><span class='font-semibold text-slate-600'>Why:</span> "+it.exp+"</p></div></div></div></div>";}
    return "<div class='qitem bg-white rounded-xl border border-slate-200 p-5'><div class='flex gap-4'><span class='paper-num acc-text text-lg leading-none pt-0.5 w-7 shrink-0 text-right'>"+(i+1)+"</span><div class='flex-1 min-w-0'><p class='text-[15px] leading-relaxed text-slate-800'>"+it.q+"</p><div class='mt-3 flex flex-wrap gap-2'><input data-input type='text' placeholder='Type your answer…' class='ring-acc text-sm px-3 py-2 rounded-lg border border-slate-300 w-full sm:w-64' autocomplete='off'><button data-check data-accepts='"+esc(JSON.stringify(it.accepts))+"' class='btn-acc text-sm font-bold px-4 py-2 rounded-lg'>Check</button><button data-reveal='"+id+"' data-show='Reveal' data-hide='Hide' class='btn-rev text-sm font-semibold text-slate-500 border border-slate-200 hover:bg-slate-50 px-3 py-2 rounded-lg'>Reveal</button></div><p data-fb class='hidden mt-2 text-sm font-semibold'></p><div id='rv-"+id+"' class='hidden mt-3 animate-fadein'><p class='text-sm'><span class='font-bold text-emerald-700'>Answer:</span> "+it.accepts.slice(0,3).map(function(a){return "<b>"+a+"</b>";}).join(" / ")+"</p><p class='text-sm text-slate-500 leading-relaxed mt-1'><span class='font-semibold text-slate-600'>Why:</span> "+it.exp+"</p></div></div></div></div>";}).join("");
  return crumbs(d.cr)+pageHead(d.title,d.tag,d.intro)+
  "<div class='flex flex-wrap gap-2 mb-6'><button data-all='show' class='text-xs font-bold text-slate-600 border border-slate-300 hover:bg-white px-3 py-1.5 rounded-lg'>Reveal all answers</button><button data-all='hide' class='text-xs font-bold text-slate-600 border border-slate-300 hover:bg-white px-3 py-1.5 rounded-lg'>Hide all answers</button></div><div class='space-y-4'>"+items+"</div>"+
  "<div class='mt-8 acc-soft border acc-line rounded-xl p-4 text-sm text-slate-600'><span class='font-bold acc-text'>Marking note:</span> Answers are matched on the spelling of the key verb/word — contractions are accepted.</div>";
}
var quizSet=[];
function drawQuiz(len){
  var byCat={};CONTENT.quiz.forEach(function(q){(byCat[q.c]=byCat[q.c]||[]).push(q);});
  var cats=Object.keys(byCat);cats.forEach(function(c){shuffle(byCat[c]);});
  var used={},picks=[];cats.forEach(function(c){used[c]=0;});
  cats.forEach(function(c){var q=Math.max(1,Math.round(len*byCat[c].length/CONTENT.quiz.length));for(var i=0;i<q&&picks.length<len&&used[c]<byCat[c].length;i++)picks.push(byCat[c][used[c]++]);});
  var ci=0;while(picks.length<len&&ci<cats.length*20){var c=cats[ci%cats.length];if(used[c]<byCat[c].length)picks.push(byCat[c][used[c]++]);ci++;}
  shuffle(picks);

  var chk=e.target.closest("[data-check]");if(chk){var item=chk.closest(".qitem"),inp=item.querySelector("[data-input]"),fb=item.querySelector("[data-fb]");var accepts=JSON.parse(chk.getAttribute("data-accepts"));var val=norm(inp.value||"");if(!val){fb.classList.remove("hidden");fb.className="mt-2 text-sm font-semibold text-amber-600";fb.textContent="Type an answer first.";return;}var ok=accepts.some(function(a){return norm(a)===val;});fb.classList.remove("hidden");fb.className="mt-2 text-sm font-semibold "+(ok?"text-emerald-600":"text-rose-500");fb.innerHTML=ok?"Correct — nicely done.":"Not quite. Press <b>Reveal</b> to see the model answer.";inp.classList.remove("border-emerald-400","border-rose-300","bg-emerald-50/40");if(ok)inp.classList.add("border-emerald-400","bg-emerald-50/40");else inp.classList.add("border-rose-300");return;}
  var mc=e.target.closest("[data-mccheck]");if(mc){var wrap=mc.closest("[data-mcwrap]"),correct=+wrap.getAttribute("data-correct"),sel=wrap.querySelector("input:checked"),exp=wrap.querySelector("[data-mcexp]");exp.classList.remove("hidden");wrap.querySelectorAll("input").forEach(function(r){r.disabled=true;});wrap.querySelectorAll(".opt").forEach(function(lab,j){if(j===correct)lab.classList.add("ok");else if(sel&&+sel.value===j)lab.classList.add("bad");});exp.classList.add((sel&&+sel.value===correct)?"bg-emerald-50":"bg-amber-50",(sel&&+sel.value===correct)?"text-emerald-900":"text-amber-900");exp.innerHTML=((sel&&+sel.value===correct)?"Correct. ":"Not quite. ")+exp.innerHTML;return;}});
document.getElementById("content").addEventListener("input",function(e){if(e.target.matches("[data-input]")){e.target.classList.remove("border-emerald-400","border-rose-300","bg-emerald-50/40");var fb=e.target.closest(".qitem");if(fb){fb=fb.querySelector("[data-fb]");if(fb)fb.classList.add("hidden");}}});
